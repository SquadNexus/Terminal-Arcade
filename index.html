<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i_am_squardii // SquadNexus Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="terminal-container">
        <header class="terminal-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">SquadNexus-Arcade-v1.0</span>
        </header>
        
        <div id="output-screen" class="output-screen">
            <h1 class="brand-title">SquadNexus</h1>
            <p class="welcome-text">SELECT AN ARCADE GAME TO PLAY:</p>
            
            <!-- Zero-Code Action Buttons -->
            <div class="quick-buttons">
                <button onclick="startBirdGame()">[ PLAY BIRD DODGE ]</button>
                <button onclick="startRiverJumpGame()">[ PLAY RIVER JUMP ]</button>
                <button onclick="resetArcade()">[ HOME / CLEAR ]</button>
            </div>
            
            <!-- Game Display Area -->
            <div id="game-container">
                <p id="game-instructions">Click a game button above to start playing!</p>
                <canvas id="gameCanvas" width="600" height="350" style="display: none;"></canvas>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
